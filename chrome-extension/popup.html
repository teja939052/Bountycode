<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlacementPro Copilot</title>
  <style>
    body { width: 340px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 12px; color: #6b7280; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { flex: 1; min-width: 120px; padding: 10px 12px; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: 12px; color: #374151; min-height: 18px; }
    .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #eef2ff; color: #1e3a8a; font-size: 11px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>PlacementPro Copilot</h1>
  <p>Autofill, tailor, and track applications.</p>
  <div class="row">
    <button id="fillBtn" class="primary">Autofill Form</button>
    <button id="tailorBtn">Tailor Resume</button>
    <button id="letterBtn">Cover Letter</button>
    <button id="trackBtn">Track Application</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="practiceBtn">Practice for This Role</button>
  </div>
  <div id="status" class="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
