name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bountycode
        options: >-
          --health-cmd "pg_isready -U postgres -d bountycode"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_DB_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bountycode
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt', 'backend/requirements-dev.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Apply Supabase schema
        run: |
          for migration in supabase/migrations/*.sql; do
            PGPASSWORD=postgres psql "postgresql://postgres:postgres@127.0.0.1:5432/bountycode" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Compile check
        run: python -m compileall app/ -q
      - name: PostgreSQL migration tests
        run: pytest -q tests/test_postgres_learning.py tests/test_postgres_assessments.py tests/test_postgres_academy.py tests/test_postgres_exam.py
      - name: MongoDB absence gate
        run: pytest -q tests/test_mongodb_absence.py
      - name: Content and pure backend tests
        run: make test-backend-unit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Reconcile frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload resolved frontend lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: frontend/package-lock.json

  curate-questions:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-curate question bank
        run: |
          python app/scripts/sanitize_qbank.py
          python app/scripts/enrich_learning_objects.py
          python app/scripts/generate_curriculum.py
          python app/scripts/finalize_curriculum.py
          python app/scripts/generate_all_role_curricula.py
      - name: Commit curated output
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions"
          git add app/content/questions app/content/curriculum
          git diff --staged --quiet || git commit -m "chore: weekly re-curate question bank"
          git push
