name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"  # Weekly re-curate question bank every Monday 3AM UTC

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall app/ scripts/ -q

      - name: Lint hardened surface (ruff)
        # Full-repo lint is grandfathered (1488 pre-existing violations tracked
        # separately). New/changed payment + economy code must stay clean.
        run: ruff check app/routes/billing.py app/routes/trial.py app/routes/student_discount.py app/routes/auth.py app/services/gamification.py app/services/auto_verify.py app/services/email.py app/config.py app/services/invoice.py app/services/feature_flags.py app/models/user.py tests/test_gamification_law.py

      - name: Validate question-bank JSON
        run: python -c "import json,glob,sys; files=glob.glob('app/data/bank_*_v2.json'); assert len(files)==11, files; [json.load(open(f,encoding='utf-8')) for f in files]; print('v2 banks OK:', len(files))"

      - name: Validate tutor trees
        run: python scripts/validate_tutor_trees.py

      - name: Validate backend missions
        run: python scripts/validate_missions.py

      - name: Mission contract gate (ADR BOUNTYCODE_CURRICULUM_STRUCTURE)
        run: python ../frontend/src/data/missions/validate.py --strict

      - name: Run question-bank tests
        run: python -m pytest tests/test_bank_v2_counts.py tests/test_bank_v2_schema.py tests/test_bank_v2_uniqueness.py tests/test_bank_v2_generators.py -q --tb=short

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q --deselect tests/test_bank_v2_correctness.py --deselect tests/test_bank_v2_store.py

      - name: Run execution-heavy bank tests
        run: python -m pytest tests/test_bank_v2_correctness.py tests/test_bank_v2_store.py -q --tb=short

      - name: Check alembic migrations
        run: |
          pip install alembic
          alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Tailwind tokens resolve
        run: npm run check:tokens

      - name: Build
        run: npm run build

  curate-questions:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-curate question bank
        run: |
          python app/scripts/sanitize_qbank.py
          python app/scripts/enrich_learning_objects.py
          python app/scripts/generate_curriculum.py
          python app/scripts/finalize_curriculum.py
          python app/scripts/generate_all_role_curricula.py
          echo "Curated bank refreshed:"
          wc -c app/content/questions/curated/curated.json app/content/questions/rejected/rejected.json app/content/questions/curated/learning_objects.json app/content/questions/review_duplicates/review_duplicates.json app/content/curriculum/learning_paths.json app/content/curriculum/final_curriculum.json app/content/curriculum/mock_tests.json app/content/curriculum/all_role_curricula.json
      - name: Commit curated output
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions"
          git add app/content/questions/curated/curated.json app/content/questions/rejected/rejected.json app/content/questions/curated/learning_objects.json app/content/questions/review_duplicates/review_duplicates.json app/content/curriculum/learning_paths.json app/content/curriculum/final_curriculum.json app/content/curriculum/mock_tests.json app/content/curriculum/all_role_curricula.json
          git diff --staged --quiet || git commit -m "chore: weekly re-curate question bank"
          git push
