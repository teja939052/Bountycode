name: Learning Experience

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/routes/company_lessons.py"
      - "backend/app/data/lessons/**"
      - "backend/tests/test_company_lesson_placement_loop.py"
      - "backend/tests/test_company_topic_progression.py"
      - "backend/tests/test_lesson_content_quality.py"
      - "frontend/src/app/AppRoutes.tsx"
      - "frontend/src/pages/LessonPlayer.tsx"
      - "frontend/src/pages/PlacementAcademy.tsx"
      - "frontend/src/hooks/useBrowserRuntime.ts"
      - "frontend/src/pages/Compiler.tsx"
      - "frontend/src/services/api/companyLessons.ts"
      - ".github/workflows/learning-experience.yml"

jobs:
  backend-learning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile learning routes
        run: python -m compileall app/routes/company_lessons.py -q
      - name: Test lesson integrity, mastery and content quality
        run: >
          python -m pytest
          tests/test_company_lesson_placement_loop.py
          tests/test_company_topic_progression.py
          tests/test_lesson_content_quality.py
          -q --tb=short

  frontend-learning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Reconcile frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
